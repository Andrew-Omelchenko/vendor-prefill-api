<svg xmlns="http://www.w3.org/2000/svg" width="680" height="452" viewBox="0 0 680 452" role="img" aria-label="Target architecture with trust boundary">
<title>Target architecture with trust boundary</title>
<desc>A client calls ApigeeX (external), which routes into the AWS account: API Gateway with an authorizer and validation invokes Lambda handlers, which use DynamoDB, Secrets Manager and CloudWatch and call external vendor APIs. Everything inside the dashed box is in the AWS account; the client, ApigeeX and vendor APIs are external.</desc>
<style>
  text { font-family: "Segoe UI", system-ui, -apple-system, sans-serif; }
  .th { font-size: 14px; font-weight: 600; }
  .ts { font-size: 12px; font-weight: 400; }
  .c-teal rect { fill: #E1F5EE; stroke: #0F6E56; }
  .c-teal .th { fill: #085041; } .c-teal .ts { fill: #0F6E56; }
  .c-amber rect { fill: #FAEEDA; stroke: #854F0B; }
  .c-amber .th { fill: #633806; } .c-amber .ts { fill: #854F0B; }
  .c-gray rect { fill: #F1EFE8; stroke: #5F5E5A; }
  .c-gray .th { fill: #2C2C2A; } .c-gray .ts { fill: #444441; }
  .arr { stroke: #5F5E5A; stroke-width: 1.5; fill: none; }
  .boundary { fill: none; stroke: #888780; stroke-width: 1; stroke-dasharray: 6 4; }
  .free { fill: #2C2C2A; } .free-muted { fill: #444441; }
  @media (prefers-color-scheme: dark) {
    .arr { stroke: #B4B2A9; }
    .boundary { stroke: #B4B2A9; }
    .free { fill: #E8E6DF; } .free-muted { fill: #B4B2A9; }
  }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<rect class="boundary" x="165" y="122" width="360" height="300" rx="16"/>
<text class="th free" x="177" y="141" text-anchor="start" dominant-baseline="central">AWS account (eu-central-1)</text>

<g class="c-gray"><rect x="30" y="58" width="115" height="56" rx="8" stroke-width="0.5"/><text class="th" x="87" y="79" text-anchor="middle" dominant-baseline="central">Client</text><text class="ts" x="87" y="97" text-anchor="middle" dominant-baseline="central">enterprise caller</text></g>
<g class="c-gray"><rect x="30" y="150" width="115" height="56" rx="8" stroke-width="0.5"/><text class="th" x="87" y="171" text-anchor="middle" dominant-baseline="central">ApigeeX</text><text class="ts" x="87" y="189" text-anchor="middle" dominant-baseline="central">enterprise edge</text></g>
<g class="c-teal"><rect x="185" y="156" width="320" height="56" rx="8" stroke-width="0.5"/><text class="th" x="345" y="177" text-anchor="middle" dominant-baseline="central">API Gateway</text><text class="ts" x="345" y="195" text-anchor="middle" dominant-baseline="central">authorizer &#183; validation</text></g>
<g class="c-teal"><rect x="185" y="246" width="320" height="56" rx="8" stroke-width="0.5"/><text class="th" x="345" y="267" text-anchor="middle" dominant-baseline="central">Lambda handlers</text><text class="ts" x="345" y="285" text-anchor="middle" dominant-baseline="central">GET &#183; POST &#183; PUT &#183; DELETE</text></g>
<g class="c-teal"><rect x="185" y="336" width="100" height="56" rx="8" stroke-width="0.5"/><text class="th" x="235" y="357" text-anchor="middle" dominant-baseline="central">DynamoDB</text><text class="ts" x="235" y="375" text-anchor="middle" dominant-baseline="central">cache + TTL</text></g>
<g class="c-teal"><rect x="295" y="336" width="100" height="56" rx="8" stroke-width="0.5"/><text class="th" x="345" y="357" text-anchor="middle" dominant-baseline="central">Secrets</text><text class="ts" x="345" y="375" text-anchor="middle" dominant-baseline="central">vendor key</text></g>
<g class="c-amber"><rect x="405" y="336" width="100" height="56" rx="8" stroke-width="0.5"/><text class="th" x="455" y="357" text-anchor="middle" dominant-baseline="central">CloudWatch</text><text class="ts" x="455" y="375" text-anchor="middle" dominant-baseline="central">alarm &#183; SNS</text></g>
<g class="c-gray"><rect x="545" y="246" width="90" height="56" rx="8" stroke-width="0.5"/><text class="th" x="590" y="267" text-anchor="middle" dominant-baseline="central">Vendors</text><text class="ts" x="590" y="285" text-anchor="middle" dominant-baseline="central">3rd-party</text></g>

<line x1="87" y1="116" x2="87" y2="148" class="arr" marker-end="url(#arrow)"/>
<line x1="147" y1="182" x2="183" y2="182" class="arr" marker-end="url(#arrow)"/>
<line x1="345" y1="214" x2="345" y2="244" class="arr" marker-end="url(#arrow)"/>
<line x1="235" y1="304" x2="235" y2="334" class="arr" marker-end="url(#arrow)"/>
<line x1="345" y1="304" x2="345" y2="334" class="arr" marker-end="url(#arrow)"/>
<line x1="455" y1="304" x2="455" y2="334" class="arr" marker-end="url(#arrow)"/>
<line x1="507" y1="274" x2="543" y2="274" class="arr" marker-end="url(#arrow)"/>

<g class="c-gray"><rect x="30" y="430" width="12" height="12" rx="3" stroke-width="0.5"/></g>
<text class="ts free-muted" x="48" y="436" text-anchor="start" dominant-baseline="central">external — outside the AWS account</text>
<g class="c-teal"><rect x="330" y="430" width="12" height="12" rx="3" stroke-width="0.5"/></g>
<text class="ts free-muted" x="348" y="436" text-anchor="start" dominant-baseline="central">AWS resources</text>
<g class="c-amber"><rect x="470" y="430" width="12" height="12" rx="3" stroke-width="0.5"/></g>
<text class="ts free-muted" x="488" y="436" text-anchor="start" dominant-baseline="central">observability</text>
</svg>
