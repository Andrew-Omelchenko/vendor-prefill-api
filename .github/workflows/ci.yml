name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run test:coverage
      - run: npm run synth # cdk synth (dev) — compiles infra AND runs cdk-nag
      - run: npx cdk synth -c env=prod # cdk-nag on the prod path (WAF/PITR enabled)
      - run: npx cdk synth -c env=dev -c authMode=cognito # cdk-nag on the Cognito fallback path
      - run: npx cdk synth -c env=demo # cdk-nag on the open demo path (no auth, mock data)
      - run: npm run openapi:check # fail if the OpenAPI spec drifted from the schemas

  # Deploy to prod only from main, using GitHub OIDC to assume an AWS role.
  # No long-lived AWS keys are stored in GitHub. The `production` environment
  # can require a manual reviewer before this job runs.
  deploy-prod:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write # required for OIDC
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-central-1
      - run: npm ci
      - run: npx cdk deploy -c env=prod --require-approval never
